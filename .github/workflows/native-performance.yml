name: Verify / Native performance
run-name: Native profile · ${{ inputs.platform }} · ${{ inputs.seconds }}s · distribution ${{ inputs.package_run }}
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful Verify distribution run at this exact commit
        type: string
        required: true
      platform:
        description: Execute one real platform adapter
        type: choice
        options: [android, ios, catalyst]
        default: catalyst
      seconds:
        description: Soak duration (60 is a smoke test; 300 or 900 for memory observations)
        type: choice
        options: ['60', '300', '900']
        default: '300'
permissions:
  contents: read
  actions: read
concurrency:
  group: native-profile-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-26' }}
    timeout-minutes: 50
    env:
      PROFILE_SECONDS: ${{ inputs.seconds }}
      PACKAGE_RUN: ${{ inputs.package_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/consumer-feed
        with:
          run-id: ${{ inputs.package_run }}
          source: Distribution
      - name: Extract and audit exact-source packages and adapters
        run: |
          tar -xzf artifacts/feed/package-feed.tar.gz
          python3 eng/package_audit.py artifacts/packages/*.nupkg --source-commit "$GITHUB_SHA"
      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.platform != 'android'
        with:
          xcode-version: '26.6'
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: inputs.platform == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and enable KVM
        if: inputs.platform == 'android'
        timeout-minutes: 5
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/mobile-toolchain
        timeout-minutes: 10
        with:
          target: ${{ inputs.platform == 'catalyst' && 'maccatalyst' || inputs.platform }}
      - name: Prepare one iOS simulator
        if: inputs.platform == 'ios'
        id: simulator
        timeout-minutes: 5
        uses: ./.github/actions/ios-simulator
      - name: Measure iOS simulator
        if: inputs.platform == 'ios'
        timeout-minutes: 40
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: python3 eng/profile-native.py ios --device "$DEVICE" --seconds "$PROFILE_SECONDS"
      - name: Measure Mac Catalyst
        if: inputs.platform == 'catalyst'
        timeout-minutes: 40
        run: python3 eng/profile-native.py catalyst --seconds "$PROFILE_SECONDS"
      - name: Measure Android emulator
        if: inputs.platform == 'android'
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          script: python3 eng/profile-native.py android --device emulator-5554 --runtime android-x64 --seconds "$PROFILE_SECONDS"
      - name: Shut down the iOS simulator
        if: ${{ always() && steps.simulator.outputs.device != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: xcrun simctl shutdown "$DEVICE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-performance-${{ inputs.platform }}
          path: artifacts/native-performance/**
          retention-days: 7
          if-no-files-found: warn
