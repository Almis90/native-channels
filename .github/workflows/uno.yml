name: Uno / Desktop packages and sample builds
on:
  push:
    branches: [develop, main]
    paths: ['src/**', 'plugins/**', 'samples/Uno/**', 'samples/Maui/AudioStreamer/MusicGenerator.cs', 'eng/**', 'Directory.*', 'global.json', '.github/workflows/uno.yml']
  pull_request:
    branches: [develop, main]
    paths: ['src/**', 'plugins/**', 'samples/Uno/**', 'samples/Maui/AudioStreamer/MusicGenerator.cs', 'eng/**', 'Directory.*', 'global.json', '.github/workflows/uno.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uno-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Package audit and five builds (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test runner acceptance and package-origin guards
        run: python -m unittest discover -s eng/tests -p test_uno_samples.py
      - name: Build isolated desktop packages and consumers
        shell: pwsh
        env:
          UNO_PLATFORM: ${{ matrix.platform }}
        run: |
          python eng/test-samples.py --framework uno --platform $env:UNO_PLATFORM --build-only --require-clean --dotnet (Get-Command dotnet).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Compilation is intentionally separate from runtime/native-view acceptance.
      # Hosted runners do not establish audio hardware, input, PDF or device support.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-desktop-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/local-samples/uno/**/summary.json
            artifacts/local-samples/uno/**/packages.json
            artifacts/local-samples/uno/**/*-assets.json
            artifacts/local-samples/uno/**/*.log
