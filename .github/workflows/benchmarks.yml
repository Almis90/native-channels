name: Verify / Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash eng/bootstrap.sh
      - run: bash eng/benchmark.sh --filter '*' --job short --exporters json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          retention-days: 7
          path: artifacts/benchmarks/**
