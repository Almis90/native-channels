name: Consumers / iOS device compile
run-name: iOS device compile · ${{ inputs.sample }} · ${{ inputs.package_source }} feed ${{ inputs.package_run }}
on:
  workflow_call:
    inputs:
      package_run:
        type: string
        required: true
      package_source:
        type: string
        default: Distribution
      sample:
        type: string
        default: Framework
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful distribution, release gate or example run ID at this commit
        type: string
        required: true
      package_source:
        description: Combined release or optional example feed
        type: choice
        options: [Distribution, Release, Example]
        default: Distribution
      sample:
        description: One package-only consumer
        type: choice
        options: [Framework, Currency, AudioStreamer, VolumeMonitor, PdfViewer]
        default: Framework
permissions:
  contents: read
  actions: read
concurrency:
  group: consumer-verify-ios-device-${{ github.ref }}-${{ inputs.sample }}-default
  cancel-in-progress: false
jobs:
  consumer:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Require an example feed when selecting a plugin
        if: inputs.sample != 'Framework' && inputs.package_source != 'Example'
        shell: bash
        run: |
          echo 'Plugin samples require package_source=Example and a matching Examples / Package build run.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/consumer-feed
        with:
          run-id: ${{ inputs.package_run }}
          source: ${{ inputs.package_source }}
      - name: Extract and audit exact-commit packages
        shell: bash
        run: |
          tar -xzf artifacts/feed/package-feed.tar.gz
          python3 eng/package_audit.py artifacts/packages/*.nupkg --source-commit "$GITHUB_SHA"
      - name: Check selected example is present
        if: inputs.sample != 'Framework'
        shell: bash
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          if ! compgen -G "artifacts/packages/Plugin.Maui.$SAMPLE.*.nupkg" > /dev/null; then
            echo "The example feed does not contain $SAMPLE." >&2
            exit 1
          fi
      - uses: ./.github/actions/select-sample
        id: sample
        with:
          sample: ${{ inputs.sample }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Set up cached iOS .NET toolchain
        timeout-minutes: 10
        uses: ./.github/actions/mobile-toolchain
        with:
          target: ios
      - name: Restore selected consumer
        timeout-minutes: 8
        env:
          SUFFIX: ${{ steps.sample.outputs.suffix }}
        run: bash "eng/restore-$SUFFIX.sh" -p:TargetFrameworks=net10.0-ios -r ios-arm64
      - name: Compile selected Release consumer (no device execution)
        id: compile
        timeout-minutes: 25
        env:
          PROJECT: ${{ steps.sample.outputs.project }}
        run: bash eng/dotnet.sh build "$PROJECT" -c Release -f net10.0-ios -r ios-arm64 --no-restore --disable-build-servers --verbosity normal -p:EnableCodeSigning=false
      - name: Record consumer stage outcomes
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SAMPLE: ${{ inputs.sample }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          CONFIGURATION: ios-device
        run: python .github/scripts/distribution-result.py record "$CONFIGURATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: consumer-evidence-${{ inputs.sample }}-ios-device
          path: artifacts/consumer-evidence/*.json
          retention-days: 7
          if-no-files-found: error
