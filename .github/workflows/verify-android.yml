name: Consumers / Android
run-name: Android ${{ inputs.runtime }} · ${{ inputs.sample }} · ${{ inputs.package_source }} feed ${{ inputs.package_run }}
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful release gate or example package run ID at this commit
        type: string
        required: true
      package_source:
        description: Combined release or optional example feed
        type: choice
        options: [Release, Example]
        default: Release
      runtime:
        description: x64 compiles and executes in the emulator; ARM64 compiles and retains a device APK
        type: choice
        options: [android-x64, android-arm64]
        default: android-x64
      sample:
        description: One package-only consumer
        type: choice
        options: [Framework, Currency, AudioStreamer, VolumeMonitor, PdfViewer]
        default: Framework
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.sample }}-${{ inputs.runtime }}
  cancel-in-progress: false
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME: ${{ inputs.runtime }}
    steps:
      - name: Require an example feed when selecting a plugin
        if: inputs.sample != 'Framework' && inputs.package_source != 'Example'
        shell: bash
        run: |
          echo 'Plugin samples require package_source=Example and a matching Examples / Package build run.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verified-artifact
        with:
          run-id: ${{ inputs.package_run }}
          workflow: ${{ inputs.package_source == 'Example' && 'build-examples.yml' || 'release-packages.yml' }}
          artifact: ${{ inputs.package_source == 'Example' && 'example-package-feed' || 'package-feed' }}
          path: artifacts/feed
          token: ${{ github.token }}
      - name: Extract and audit exact-commit packages
        shell: bash
        run: |
          tar -xzf artifacts/feed/package-feed.tar.gz
          python3 eng/package_audit.py artifacts/packages/*.nupkg --source-commit "$GITHUB_SHA"
      - name: Check selected example is present
        if: inputs.sample != 'Framework'
        shell: bash
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          if ! compgen -G "artifacts/packages/Plugin.Maui.$SAMPLE.*.nupkg" > /dev/null; then
            echo "The example feed does not contain $SAMPLE." >&2
            exit 1
          fi
      - uses: ./.github/actions/select-sample
        id: sample
        with:
          sample: ${{ inputs.sample }}
      - name: Free space for the Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up cached Android .NET toolchain
        timeout-minutes: 10
        uses: ./.github/actions/mobile-toolchain
        with:
          target: android
      - name: Install Android SDK platform and build tools
        timeout-minutes: 5
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore selected consumer
        timeout-minutes: 8
        env:
          SUFFIX: ${{ steps.sample.outputs.suffix }}
        run: bash "eng/restore-$SUFFIX.sh" -p:TargetFrameworks=net10.0-android -r "$RUNTIME"
      - name: Compile selected Release consumer
        timeout-minutes: 12
        env:
          PROJECT: ${{ steps.sample.outputs.project }}
        run: bash eng/dotnet.sh build "$PROJECT" -c Release -f net10.0-android -r "$RUNTIME" --no-restore --disable-build-servers --verbosity normal
      - name: Retain ARM64 device APK
        if: inputs.runtime == 'android-arm64'
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: android-${{ inputs.sample }}-arm64-apk
          path: ${{ steps.sample.outputs.project }}/bin/Release/net10.0-android/android-arm64/*-Signed.apk
          retention-days: 3
          if-no-files-found: error
      - name: Enable KVM
        if: inputs.runtime == 'android-x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute selected consumer
        if: inputs.runtime == 'android-x64'
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SUFFIX: ${{ steps.sample.outputs.suffix }}
          AUDIO_VERIFICATION_RUNS: '5'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          script: bash "eng/verify-android-${SUFFIX%-sample}.sh" emulator-5554 Release android-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: android-${{ inputs.sample }}-${{ inputs.runtime }}-logs
          path: artifacts/android-consumers/**
          retention-days: 3
          if-no-files-found: ignore
