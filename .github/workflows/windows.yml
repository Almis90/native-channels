name: Consumers / Windows
run-name: Windows Â· ${{ inputs.sample }} Â· ${{ inputs.package_source }} feed ${{ inputs.package_run }}
on:
  workflow_call:
    inputs:
      package_run:
        type: string
        required: true
      package_source:
        type: string
        default: Distribution
      sample:
        type: string
        default: Framework
      runtime:
        type: string
        default: win-x64
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful distribution, release gate or example run ID at this commit
        type: string
        required: true
      package_source:
        description: Combined release or optional example feed
        type: choice
        options: [Distribution, Release, Example]
        default: Distribution
      sample:
        description: One package-only consumer
        type: choice
        options: [Framework, Currency, AudioStreamer, VolumeMonitor, PdfViewer]
        default: Framework
      runtime:
        description: Compile architecture (no desktop UI execution)
        type: choice
        options: [win-x64, win-arm64]
        default: win-x64
permissions:
  contents: read
  actions: read
concurrency:
  group: consumer-windows-${{ github.ref }}-${{ inputs.sample }}-${{ inputs.runtime }}
  cancel-in-progress: false
jobs:
  consumer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Require an example feed when selecting a plugin
        if: inputs.sample != 'Framework' && inputs.package_source != 'Example'
        shell: bash
        run: |
          echo 'Plugin samples require package_source=Example and a matching Examples / Package build run.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/consumer-feed
        with:
          run-id: ${{ inputs.package_run }}
          source: ${{ inputs.package_source }}
      - name: Extract and audit exact-commit packages
        shell: bash
        run: |
          tar -xzf artifacts/feed/package-feed.tar.gz artifacts/packages artifacts/package-audit.json
          python eng/package_audit.py artifacts/packages/*.nupkg --source-commit "$GITHUB_SHA"
      - name: Check selected example is present
        if: inputs.sample != 'Framework'
        shell: bash
        env:
          SAMPLE: ${{ inputs.sample }}
        run: |
          PACKAGE="Plugin.$SAMPLE"; if [[ "$SAMPLE" == PdfViewer ]]; then PACKAGE="Plugin.Maui.PdfViewer"; fi
          if ! compgen -G "artifacts/packages/$PACKAGE.*.nupkg" > /dev/null; then
            echo "The example feed does not contain $SAMPLE." >&2
            exit 1
          fi
      - name: Set up cached Windows toolchain
        timeout-minutes: 10
        uses: ./.github/actions/windows-toolchain
      - name: Compile consumer and run applicable native API tests
        id: compile
        timeout-minutes: 20
        shell: pwsh
        env:
          SAMPLE: ${{ inputs.sample }}
          RUNTIME: ${{ inputs.runtime }}
        run: |
          $parameters = @{ PackageFeed = 'artifacts/packages'; RuntimeIdentifier = $env:RUNTIME; BuildOnly = $true }
          if ($env:SAMPLE -ne 'Framework') { $parameters.Plugin = $env:SAMPLE }
          ./eng/verify-windows.ps1 @parameters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: windows-${{ inputs.sample }}-${{ inputs.runtime }}-results
          retention-days: 3
          if-no-files-found: ignore
          path: |
            artifacts/windows/verification/*/*.trx
            artifacts/windows/verification/*/verification.json
      - name: Record consumer stage outcomes
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SAMPLE: ${{ inputs.sample }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          CONFIGURATION: ${{ inputs.runtime }}
        run: python .github/scripts/distribution-result.py record "$CONFIGURATION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: consumer-evidence-${{ inputs.sample }}-${{ inputs.runtime }}
          path: artifacts/consumer-evidence/*.json
          retention-days: 7
          if-no-files-found: error
