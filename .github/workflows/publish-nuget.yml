name: Release / Publish NuGet
run-name: NuGet ${{ inputs.version }} · publish=${{ inputs.publish }} · accepted release ${{ inputs.candidate_release }}
on:
  workflow_dispatch:
    inputs:
      candidate_release:
        description: Draft GitHub release ID containing the locally accepted bundle
        type: string
        required: true
      bundle_sha256:
        description: SHA-256 of the reviewed accepted ZIP (not rebuilt by this workflow)
        type: string
        required: true
      version:
        description: Exact preview version in the locally accepted packages
        type: string
        required: true
      publish:
        description: Publish to NuGet.org after environment approval (false validates only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: nuget-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact archives and committed local acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE: ${{ inputs.candidate_release }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 eng/trusted-preview.py prepare --release-id "$CANDIDATE_RELEASE" \
            --bundle-sha256 "$BUNDLE_SHA256" --version "$VERSION" \
            --directory artifacts/nuget-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-candidate
          path: artifacts/nuget-candidate/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: validate
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: nuget-candidate
          path: artifacts/nuget-candidate
      - name: Recheck archives, source ancestry and public-version conflicts before authentication
        env:
          VERSION: ${{ inputs.version }}
        run: python3 eng/trusted-preview.py verify --directory artifacts/nuget-candidate --version "$VERSION"
      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the six verified packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PUBLISH_NUGET: 'true'
          VERSION: ${{ inputs.version }}
        run: |
          python3 eng/trusted-preview.py publish --directory artifacts/nuget-candidate \
            --version "$VERSION" --submission-report artifacts/nuget-submission.json
      - name: Preserve submission results even after a partial upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-submission
          path: artifacts/nuget-submission.json
          retention-days: 30
          if-no-files-found: ignore
