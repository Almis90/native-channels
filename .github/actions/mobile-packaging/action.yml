name: Set up mobile packaging
description: Install the pinned native and managed tools for mobile package assembly.
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - shell: bash
      run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
    - shell: bash
      run: bash eng/bootstrap.sh --platforms
